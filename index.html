<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Repo Tracker</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 800px;
        margin: auto;
      }
      .error {
        color: red;
        font-weight: bold;
      }
      .repo {
        border: 1px solid #ccc;
        padding: 10px;
        margin-top: 10px;
        border-radius: 5px;
      }
      .owner-details {
        background: #f9f9f9;
        padding: 15px;
        border-radius: 5px;
        margin-top: 20px;
      }
      .owner-details img {
        border-radius: 50%;
        width: 100px;
      }
    </style>
  </head>
  <body>
    <h1>GitHub Repository Tracker</h1>
    <input type="text" id="usernameInput" placeholder="Enter GitHub Username" />
    <button id="fetchBtn">Fetch Data</button>

    <div id="statusMessage"></div>
    <div id="ownerContainer"></div>
    <div id="reposContainer"></div>

    <script src="app.js"></script>
  </body>
</html>
